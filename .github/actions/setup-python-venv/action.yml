# Composite action — every Python job uses this to provision Python 3.13,
# install uv, build a project-relative .venv with all `[dev]` deps, and
# generate the gRPC stubs that mypy / pytest import transitively.
#
# Caches:
# - .venv/ keyed on the resolved interpreter/path/ABI and pyproject.toml.
# - uv's download cache keyed on the same so the next run is fast even
#   on a fresh runner.
name: Set up Python venv with project deps
description: |
  Provision Python 3.13, uv, .venv with [dev] deps, and gRPC stubs.

runs:
  using: composite
  steps:
    - name: Set up Python
      id: python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Identify resolved Python
      id: python-identity
      shell: bash
      run: |
        python -I -S - <<'PY'
        import hashlib, json, os, platform, sys, sysconfig
        executable = os.path.realpath(sys.executable)
        version = platform.python_version()
        identity = [version, executable, sysconfig.get_config_var("SOABI")]
        fingerprint = hashlib.sha256(json.dumps(identity).encode()).hexdigest()
        with open(os.environ["GITHUB_OUTPUT"], "a") as output:
            output.write(f"version={version}\nexecutable={executable}\ncache-key={fingerprint}\n")
        PY

    - name: Cache uv download cache
      uses: actions/cache@v4
      with:
        path: .uv-cache
        key: uv-cache-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          uv-cache-${{ runner.os }}-

    - name: Cache .venv
      id: cache-venv
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.python-identity.outputs.version }}-${{ steps.python-identity.outputs.cache-key }}-${{ hashFiles('pyproject.toml') }}

    - name: Validate restored venv interpreter
      id: validate-venv
      shell: bash
      run: |
        python -I -S - <<'PY'
        import json, os, platform, subprocess, sys, sysconfig
        expected = [platform.python_version(), os.path.realpath(sys.executable),
                    sysconfig.get_config_var("SOABI")]
        probe = (
            "import json,os,platform,sys,sysconfig; "
            "print(json.dumps([platform.python_version(), "
            "os.path.realpath(sys._base_executable), sysconfig.get_config_var('SOABI')]))"
        )
        valid = False
        try:
            result = subprocess.run([".venv/bin/python", "-I", "-S", "-c", probe],
                                    capture_output=True, text=True, timeout=10, check=True)
            valid = json.loads(result.stdout) == expected
        except (OSError, subprocess.SubprocessError, ValueError):
            pass
        with open(os.environ["GITHUB_OUTPUT"], "a") as output:
            output.write(f"valid={str(valid).lower()}\n")
        PY

    - name: Install uv
      shell: bash
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Build venv (cache miss or invalid interpreter)
      if: steps.cache-venv.outputs.cache-hit != 'true' || steps.validate-venv.outputs.valid != 'true'
      shell: bash
      env:
        UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
        UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
        CI_BASE_PYTHON: ${{ steps.python-identity.outputs.executable }}
      run: |
        # `--clear` on cache miss so a stale layer can't poison the build.
        uv venv --python "$CI_BASE_PYTHON" --clear .venv
        uv pip install --python .venv/bin/python -e ".[dev]"

    # Generate gRPC stubs every run (cheap; the .venv cache covers deps but
    # not generated files). mypy + pytest import these transitively.
    - name: Generate gRPC stubs
      shell: bash
      run: |
        .venv/bin/python -m grpc_tools.protoc \
          --plugin=protoc-gen-grpclib_python=.venv/bin/protoc-gen-grpclib_python \
          --proto_path=proto \
          --python_out=src/eveys_ocpp/_generated \
          --grpclib_python_out=src/eveys_ocpp/_generated \
          proto/ocpp_gw/v1/gateway.proto \
          proto/events/v1/events.proto
        find src/eveys_ocpp/_generated -mindepth 1 -type d -exec touch {}/__init__.py \;
