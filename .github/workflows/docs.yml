# Tagged-release docs build. Runs on tags matching `docs-v*` and produces a
# downloadable HTML artifact. Same shape as the GitLab `docs:build` job.
# The site is NOT auto-published — it's an internal-only artifact.
name: docs

on:
  push:
    tags:
      - "docs-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Sphinx
        run: pip install --no-cache-dir -r docs/requirements.txt
      - name: Build site
        # CI runs in a clean environment, so we skip the local Makefile's
        # venv setup and invoke sphinx-build directly. Same flags the
        # Makefile uses: -W (warnings as errors), --keep-going, -n (nitpicky).
        run: sphinx-build -M html docs docs/_build -W --keep-going -n
      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: eveys-ocpp-docs-${{ github.ref_name }}
          path: docs/_build/html
          retention-days: 30
