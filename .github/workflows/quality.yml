# Quality gate — lint + types + config-reference-fresh + proto-breaking.
# Each job is independent so a single red gate doesn't mask another.
name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python-venv
      - name: ruff check
        run: .venv/bin/ruff check src tests scripts

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python-venv
      - name: mypy --strict
        run: .venv/bin/mypy

  # E0-14 — `Settings` is the source of truth for docs/11-configuration-reference.md
  # and .env.example. The generator at scripts/render_config_reference.py produces
  # both files deterministically; --check exits non-zero if the produced output
  # differs from the committed files. Hard-fails by design (no bypass label).
  config-reference-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python-venv
      - name: render --check
        run: .venv/bin/python scripts/render_config_reference.py --check

  # E2-12 — proto backward-compat gate (ADR-0018). Runs `buf breaking` against
  # main so a field rename / removal / renumbering / oneof-shape change in
  # proto/ocpp_gw/v1/ or proto/events/v1/ fails the PR before it can land.
  # Only runs on PR events; on main pushes there's nothing to compare.
  # Bypass: add the `bypass-breaking-change` label to the PR.
  proto-breaking:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BUF_VERSION: "1.45.0"
    steps:
      - uses: actions/checkout@v6
        with:
          # `buf breaking --against` needs the base branch as a git ref. Fetch
          # depth 50 is enough for typical PRs without pulling full history.
          fetch-depth: 50
      - name: Fetch main as a baseline
        run: git fetch --depth=50 origin main:main || true
      - name: Install buf
        run: |
          curl -sSL "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64" \
            -o /usr/local/bin/buf
          sudo chmod +x /usr/local/bin/buf
          buf --version
      - name: Check for bypass label
        id: bypass
        run: |
          labels='${{ toJson(github.event.pull_request.labels.*.name) }}'
          if echo "$labels" | grep -Fq '"bypass-breaking-change"'; then
            echo "bypass=1" >> "$GITHUB_OUTPUT"
            echo "WARNING: bypass-breaking-change label present — proto-breaking gate skipped."
            echo "Per ADR-0018, this requires tech-lead approval and a same-PR package version bump."
          fi
      - name: buf breaking (per module)
        if: steps.bypass.outputs.bypass != '1'
        run: |
          for module in proto/ocpp_gw/v1 proto/events/v1; do
            echo "=== buf breaking: $module ==="
            buf breaking "$module" --against ".git#branch=main,subdir=$module"
          done

  # E5-1 — validate Envoy config without binding listeners. Catches
  # typos, removed filter names after Envoy major bumps, dangling
  # cluster references. Runs in seconds.
  envoy-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Generate ephemeral self-signed certs so Envoy's validate-mode
      # can load the TLS listener config. The certs aren't trusted by
      # anything; they exist only to satisfy the file-path validation.
      - name: Generate dev certs
        run: |
          bash scripts/gen-dev-certs.sh 30
          # Envoy in the official image runs as a non-root user.
          # The default 0644 / 0600 modes from openssl on the GitHub
          # runner aren't world-readable for the key — make both
          # readable so the container can mount-and-read them.
          chmod a+r deploy/envoy/certs/server.crt deploy/envoy/certs/server.key
      - name: envoy --mode validate (compose config)
        run: |
          docker run --rm -v "$(pwd)/deploy/envoy:/etc/envoy:ro" \
            envoyproxy/envoy:v1.31-latest \
            envoy --mode validate -c /etc/envoy/envoy.local.yaml
      # The k8s config references a Secret-mounted path (/etc/envoy/certs/tls.{crt,key})
      # that doesn't exist outside a real cluster. Re-symlink the dev
      # certs into that path so validate-mode can load them.
      - name: Stage k8s-shape cert paths from dev certs
        run: |
          cp deploy/envoy/certs/server.crt deploy/envoy/certs/tls.crt
          cp deploy/envoy/certs/server.key deploy/envoy/certs/tls.key
          chmod a+r deploy/envoy/certs/tls.crt deploy/envoy/certs/tls.key
      # E5-5 — envoy.yaml's upstream cluster references
      # /etc/envoy/upstream-certs/{tls.crt,tls.key,ca.crt}. Those
      # paths are populated by a Helm-mounted Secret in production;
      # in CI we stage symlinks to the same dev certs so
      # `envoy --mode validate` finds the files.
      - name: Stage upstream-mtls cert paths from dev certs
        run: |
          mkdir -p deploy/envoy/upstream-certs
          cp deploy/envoy/certs/server.crt deploy/envoy/upstream-certs/tls.crt
          cp deploy/envoy/certs/server.key deploy/envoy/upstream-certs/tls.key
          cp deploy/envoy/certs/server.crt deploy/envoy/upstream-certs/ca.crt
          chmod a+r deploy/envoy/upstream-certs/*
      - name: envoy --mode validate (k8s config)
        run: |
          docker run --rm -v "$(pwd)/deploy/envoy:/etc/envoy:ro" \
            envoyproxy/envoy:v1.31-latest \
            envoy --mode validate -c /etc/envoy/envoy.yaml

  # E5-1 — helm chart hygiene. Lints the chart, renders templates
  # with default values, and refuses any drift between the canonical
  # `deploy/envoy/envoy.yaml` and the chart-local copy at
  # `deploy/helm/eveys-ocpp/files/envoy.yaml`. Helm's .Files.Get can't
  # traverse outside the chart, so we keep a copy + gate against
  # drift — same pattern as `config-reference-fresh` and
  # `proto-breaking`.
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0
      - name: helm lint
        run: |
          helm lint deploy/helm/eveys-ocpp \
            --set gateway.image.repository=ghcr.io/eveys-mobility/ocpp
      - name: helm template (default values render)
        run: |
          helm template test deploy/helm/eveys-ocpp \
            --set gateway.image.repository=ghcr.io/eveys-mobility/ocpp \
            --set envoy.tls.secretName=ocpp-tls \
            --set gateway.secrets.name=ocpp-secrets \
            > /tmp/rendered.yaml
          test -s /tmp/rendered.yaml
      - name: envoy config drift check (canonical vs chart copy)
        run: |
          diff -u deploy/envoy/envoy.yaml deploy/helm/eveys-ocpp/files/envoy.yaml \
            || (echo "::error::deploy/helm/eveys-ocpp/files/envoy.yaml drifted from deploy/envoy/envoy.yaml — copy the canonical file" && exit 1)
