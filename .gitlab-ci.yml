stages:
  - quality   # lint + mypy in parallel
  - test      # pytest with coverage
  - docs      # tagged-release docs build (existing)

# ---- shared anchors --------------------------------------------------------
#
# All Python jobs share: the project's runtime base image, uv as installer,
# and a venv at .venv/ that's cached between runs. The first job in a
# pipeline pays the install cost; the rest of the pipeline reuses the venv.

.python-job: &python-job
  image: python:3.13-slim
  variables:
    DEBIAN_FRONTEND: noninteractive
    # Persist uv's download cache at a project-relative path so GitLab's
    # cache mechanism can pick it up.
    UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache
    # uv must use a project-relative venv (default `.venv`) so the cache
    # path matches.
    UV_PROJECT_ENVIRONMENT: $CI_PROJECT_DIR/.venv
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends curl ca-certificates >/dev/null
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
    # `--clear` so a venv restored from cache is rebuilt against the
    # current pyproject.toml deterministically.
    - uv venv --clear .venv
    - uv pip install --python .venv/bin/python -e ".[dev]"
    # Generate gRPC stubs so mypy / pytest can import them. Locally
    # `make install` does this; CI calls protoc directly to skip the
    # Makefile's .venv-creation steps.
    - .venv/bin/python -m grpc_tools.protoc
        --plugin=protoc-gen-grpclib_python=.venv/bin/protoc-gen-grpclib_python
        --proto_path=proto
        --python_out=src/eveys_ocpp/_generated
        --grpclib_python_out=src/eveys_ocpp/_generated
        proto/ocpp_gw/v1/gateway.proto
        proto/events/v1/events.proto
    - find src/eveys_ocpp/_generated -mindepth 1 -type d -exec touch {}/__init__.py \;
  cache:
    key:
      files:
        - pyproject.toml
    paths:
      - .venv/
      - .uv-cache/
  rules:
    # Run on MRs into any branch, and on pushes to main. Skip on tag pushes
    # (the docs job handles those separately).
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---- E0-3 quality gate -----------------------------------------------------

lint:
  <<: *python-job
  stage: quality
  script:
    - .venv/bin/ruff check src tests

types:
  <<: *python-job
  stage: quality
  script:
    - .venv/bin/mypy

# ---- E2-12 proto backward-compat gate (ADR-0018) ---------------------------
#
# Runs `buf breaking` against `main` so a field rename / removal /
# renumbering / oneof-shape change in `proto/ocpp_gw/v1/` or
# `proto/events/v1/` fails the MR before it can land. Hard-fails by
# design — the proto contracts are explicitly frozen at v1
# (`proto/README.md`); this gate enforces what the docs already promise.
#
# Only runs on MR pipelines (where there's a `main` to compare against).
# On pushes to `main` itself there's nothing to compare.
#
# Bypass: an intentional v1→v2 break adds the `bypass-breaking-change`
# label to the MR. The job exits 0 with a loud WARNING but the policy
# (per ADR-0018) requires a tech-lead approval and a same-MR package
# version bump.
proto-breaking:
  image: alpine:3.20
  stage: quality
  rules:
    # MR pipelines only. On main push pipelines the gate is a no-op.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    # Pinned in line with ADR-0018 § Risks. Bump deliberately.
    BUF_VERSION: "1.45.0"
  before_script:
    - apk add --no-cache curl git ca-certificates
    # Install pinned `buf` binary. One static Go binary, ~25 MB.
    - curl -sSL "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64"
        -o /usr/local/bin/buf
    - chmod +x /usr/local/bin/buf
    - buf --version
    # MR pipelines fetch only the source branch by default. Fetch `main`
    # explicitly so `buf breaking --against '.git#branch=main'` has a
    # baseline to compare against.
    - git fetch --depth=50 origin "${CI_DEFAULT_BRANCH}:${CI_DEFAULT_BRANCH}" || true
  script:
    # Bypass for intentional v1→v2 breaks. Per ADR-0018 the policy is
    # tech-lead approval + same-MR version bump; this script just lets
    # the pipeline pass — it does not enforce the policy itself.
    - |
      if echo "${CI_MERGE_REQUEST_LABELS}" | tr ',' '\n' | grep -Fxq "bypass-breaking-change"; then
        echo "WARNING: bypass-breaking-change label present — proto-breaking gate skipped."
        echo "Per ADR-0018, this requires tech-lead approval and a same-MR package version bump."
        exit 0
      fi
    # `buf breaking` with a v2 multi-module workspace needs to be
    # invoked per module; comparing the whole workspace against a
    # whole-workspace baseline conflates the two modules' image counts.
    # Loop over each module and compare it to its own subdir on main.
    - |
      for module in proto/ocpp_gw/v1 proto/events/v1; do
        echo "=== buf breaking: $module ==="
        buf breaking "$module" --against ".git#branch=${CI_DEFAULT_BRANCH},subdir=$module"
      done

tests:
  <<: *python-job
  stage: test
  # Redis is the only data-plane dep the unit suite needs. Without it,
  # `tests/unit/test_bus.py` skips its 6 tests and the bus module drops
  # to ~18% coverage, which breaks the 80% gate (E2-10). Postgres /
  # Kafka / ClickHouse stay over in `tests:e2e` — the unit suite mocks
  # them at the boundary.
  services:
    - name: redis:7-alpine
      alias: redis
  variables:
    DEBIAN_FRONTEND: noninteractive
    UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache
    UV_PROJECT_ENVIRONMENT: $CI_PROJECT_DIR/.venv
    E2E_REDIS_HOST: redis
    # Refuse to silently skip the bus tests if Redis isn't reachable.
    # A green-but-skipped pipeline would let coverage rot.
    E2E_REQUIRE: "1"
  script:
    # Wait for Redis to accept TCP connections; the service container
    # boots in parallel with the job. Without this the first test's
    # connection attempt may race the broker.
    - apt-get install -y --no-install-recommends netcat-openbsd >/dev/null
    - |
      for i in $(seq 1 60); do
        if nc -z redis 6379 2>/dev/null; then
          echo "redis:6379 reachable after ${i}s"
          break
        fi
        sleep 1
      done
    # Unit tests only. E2E tests skip themselves when the data plane
    # isn't reachable — they run in `tests:e2e` below, which provides
    # the full data plane via GitLab `services:` sidecars.
    - .venv/bin/pytest tests/unit tests/test_package.py --cov-report=xml --cov-report=term
  coverage: '/Total coverage: (\d+\.\d+)%/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
    expire_in: 14 days

tests:e2e:
  <<: *python-job
  stage: test
  # The data-plane stack as GitLab `services:` sidecars. Image versions
  # mirror deploy/compose/docker-compose.yml so dev and CI behavior match.
  services:
    - name: postgres:16-alpine
      alias: postgres
      variables:
        POSTGRES_USER: eveys
        POSTGRES_PASSWORD: eveys
        POSTGRES_DB: eveys_ocpp
    - name: redis:7-alpine
      alias: redis
    - name: apache/kafka:3.7.0
      alias: kafka
      variables:
        KAFKA_NODE_ID: "1"
        KAFKA_PROCESS_ROLES: "broker,controller"
        # Inside the service container, the alias `kafka` does NOT resolve
        # to itself. Use `localhost:9093` for the controller quorum (the
        # broker talks to its own controller process via loopback). Clients
        # in the job container still reach the broker as `kafka:9092` over
        # the GitLab services network.
        KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
        KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
        KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
        KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
        KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
        KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
        CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    - name: clickhouse/clickhouse-server:24
      alias: clickhouse
      variables:
        CLICKHOUSE_DB: eveys_ocpp
  variables:
    # `services:` aliases become resolvable hostnames inside the job
    # container. Override the test defaults of `localhost` so the e2e
    # tests can find Postgres / Redis / Kafka / ClickHouse.
    DEBIAN_FRONTEND: noninteractive
    UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache
    UV_PROJECT_ENVIRONMENT: $CI_PROJECT_DIR/.venv
    E2E_PG_HOST: postgres
    E2E_REDIS_HOST: redis
    E2E_KAFKA_HOST: kafka
    E2E_CH_HOST: clickhouse
    # ClickHouse listens on 8123 (HTTP) and 9000 (native protocol)
    # inside its container. GitLab `services:` expose the container
    # ports directly on the shared network — no host-side remap, so
    # the in-job hostname:port pair is `clickhouse:8123` and
    # `clickhouse:9000`. Local-dev compose remaps 9000→9001 on the
    # host to dodge IDE conflicts (see deploy/compose/docker-compose.yml);
    # CI doesn't have that issue. Set both explicitly so a future
    # change to compose's host-port mapping can't silently break CI.
    E2E_CH_HTTP_PORT: "8123"
    E2E_CH_NATIVE_PORT: "9000"
    # The Kafka→ClickHouse e2e test reads this directly to point its
    # in-process ingestor at the right ClickHouse.
    EVEYS_OCPP_CLICKHOUSE_HOST: clickhouse
    EVEYS_OCPP_CLICKHOUSE_PORT: "9000"
    EVEYS_OCPP_CLICKHOUSE_DB: eveys_ocpp
    # In CI, refuse to silently skip the e2e tests if a service isn't
    # reachable — a green-but-skipped pipeline is worse than a red one.
    E2E_REQUIRE: "1"
    # Same DSN the runtime reads from — used by alembic.
    EVEYS_OCPP_DB_URL: postgresql+asyncpg://eveys:eveys@postgres:5432/eveys_ocpp
  script:
    # Wait for every service to accept TCP connections. Services boot in
    # parallel with the job container; Kafka in particular needs ~20s for
    # the KRaft controller to come up and the broker listener to bind.
    - apt-get install -y --no-install-recommends postgresql-client netcat-openbsd >/dev/null
    - |
      wait_tcp() {
        local host=$1 port=$2 timeout=${3:-90}
        for i in $(seq 1 "$timeout"); do
          if nc -z "$host" "$port" 2>/dev/null; then
            echo "  $host:$port reachable after ${i}s"
            return 0
          fi
          sleep 1
        done
        echo "ERROR: $host:$port not reachable after ${timeout}s"
        return 1
      }
      wait_tcp postgres 5432 60
      wait_tcp redis 6379 60
      wait_tcp clickhouse 8123 60
      wait_tcp clickhouse 9000 60
      wait_tcp kafka 9092 90
    - .venv/bin/alembic upgrade head
    # Apply the ClickHouse schema before pytest so the e2e schema
    # checks find the tables they expect. Idempotent.
    - .venv/bin/python -m eveys_ocpp.clickhouse.migrate
        --host "${E2E_CH_HOST}"
        --port "${E2E_CH_HTTP_PORT}"
        --db "${EVEYS_OCPP_CLICKHOUSE_DB}"
    - .venv/bin/pytest tests/e2e -v --no-cov

# ---- docs (tagged-release artifact, unchanged) -----------------------------

docs:build:
  stage: docs
  image: python:3.13-slim
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - cd docs
    - pip install --no-cache-dir -r requirements.txt
    # CI runs in a clean python:3.13-slim container, so we skip the local
    # Makefile's venv setup and invoke sphinx-build directly.
    - sphinx-build -M html . _build -W --keep-going -n
  artifacts:
    name: "eveys-ocpp-docs-$CI_COMMIT_TAG"
    paths:
      - docs/_build/html
    expire_in: 30 days
