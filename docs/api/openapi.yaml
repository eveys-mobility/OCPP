components:
  schemas:
    ChargePoint:
      description: 'One row of `GET /api/v1/charge-points`. Detail endpoint adds

        `active_reservations` and `active_charging_profiles`.'
      properties:
        connectors:
          items:
            $ref: '#/components/schemas/ConnectorStatus'
          title: Connectors
          type: array
        cp_id:
          description: Stable identifier the charger sent in BootNotification.
          title: Cp Id
          type: string
        firmware_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Firmware Version
        last_heartbeat_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Heartbeat At
        last_status:
          anyOf:
          - type: string
          - type: 'null'
          description: Last-write-wins across connectors. For multi-connector chargers,
            prefer `connectors[]` (the per-connector array) — `last_status` is a single-string
            convenience for callers that don't need per-connector resolution.
          title: Last Status
        last_status_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Status At
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
        online:
          description: True iff some pod currently holds the charger's WS.
          title: Online
          type: boolean
        pod_id:
          anyOf:
          - type: string
          - type: 'null'
          description: Which gateway pod owns the WS. None when offline.
          title: Pod Id
        serial_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Serial Number
        vendor:
          anyOf:
          - type: string
          - type: 'null'
          title: Vendor
      required:
      - cp_id
      - online
      title: ChargePoint
      type: object
    ChargePointDetail:
      example:
        active_charging_profiles: []
        active_reservations: []
        connectors:
        - connector_id: 1
          error_code: NoError
          status: Charging
          timestamp: '2026-05-07T12:34:56+00:00'
        cp_id: CP_BERLIN_001
        firmware_version: 1.2.3
        last_heartbeat_at: '2026-05-07T12:35:00+00:00'
        last_status: Charging
        last_status_at: '2026-05-07T12:34:56+00:00'
        model: X1
        online: true
        pod_id: ocpp-gw-7f9c4-x2k8q
        request_id: 9b3c5d18-1f7c-4b6a-8e0e-5b9a3c4f2e10
        serial_number: SN-12345
        vendor: ACME
      properties:
        active_charging_profiles:
          items:
            $ref: '#/components/schemas/ChargingProfile'
          title: Active Charging Profiles
          type: array
        active_reservations:
          items:
            $ref: '#/components/schemas/Reservation'
          title: Active Reservations
          type: array
        connectors:
          items:
            $ref: '#/components/schemas/ConnectorStatus'
          title: Connectors
          type: array
        cp_id:
          description: Stable identifier the charger sent in BootNotification.
          title: Cp Id
          type: string
        firmware_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Firmware Version
        last_heartbeat_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Heartbeat At
        last_status:
          anyOf:
          - type: string
          - type: 'null'
          description: Last-write-wins across connectors. For multi-connector chargers,
            prefer `connectors[]` (the per-connector array) — `last_status` is a single-string
            convenience for callers that don't need per-connector resolution.
          title: Last Status
        last_status_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Status At
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
        online:
          description: True iff some pod currently holds the charger's WS.
          title: Online
          type: boolean
        pod_id:
          anyOf:
          - type: string
          - type: 'null'
          description: Which gateway pod owns the WS. None when offline.
          title: Pod Id
        request_id:
          title: Request Id
          type: string
        serial_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Serial Number
        vendor:
          anyOf:
          - type: string
          - type: 'null'
          title: Vendor
      required:
      - cp_id
      - online
      - request_id
      title: ChargePointDetail
      type: object
    ChargePointListResponse:
      description: '`GET /api/v1/charge-points`. Cursor-paginated. `next_cursor=null`

        means no more pages.'
      example:
        charge_points:
        - connectors: []
          cp_id: CP_BERLIN_001
          firmware_version: 1.2.3
          last_heartbeat_at: '2026-05-07T12:35:00+00:00'
          last_status: Available
          last_status_at: '2026-05-07T12:30:00+00:00'
          model: X1
          online: true
          pod_id: ocpp-gw-7f9c4-x2k8q
          serial_number: SN-12345
          vendor: ACME
        next_cursor: eyJpZCI6IDQyfQ==
        request_id: 9b3c5d18-1f7c-4b6a-8e0e-5b9a3c4f2e10
      properties:
        charge_points:
          items:
            $ref: '#/components/schemas/ChargePoint'
          title: Charge Points
          type: array
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
        request_id:
          title: Request Id
          type: string
      required:
      - charge_points
      - next_cursor
      - request_id
      title: ChargePointListResponse
      type: object
    ChargingProfile:
      description: 'Mirror of the OCPP 1.6 SetChargingProfile request payload, as

        persisted server-side. The shape is dynamic per the OCPP spec —

        we treat it as opaque-ish for OpenAPI purposes.'
      properties:
        charging_profile_id:
          title: Charging Profile Id
          type: integer
        charging_profile_kind:
          title: Charging Profile Kind
          type: string
        charging_profile_purpose:
          title: Charging Profile Purpose
          type: string
        charging_schedule:
          additionalProperties: true
          title: Charging Schedule
          type: object
        recurrency_kind:
          anyOf:
          - type: string
          - type: 'null'
          title: Recurrency Kind
        stack_level:
          title: Stack Level
          type: integer
        valid_from:
          anyOf:
          - type: string
          - type: 'null'
          title: Valid From
        valid_to:
          anyOf:
          - type: string
          - type: 'null'
          title: Valid To
      required:
      - charging_profile_id
      - stack_level
      - charging_profile_purpose
      - charging_profile_kind
      - charging_schedule
      title: ChargingProfile
      type: object
    ChargingProfileListResponse:
      properties:
        charging_profiles:
          items:
            $ref: '#/components/schemas/ChargingProfile'
          title: Charging Profiles
          type: array
        request_id:
          title: Request Id
          type: string
      required:
      - charging_profiles
      - request_id
      title: ChargingProfileListResponse
      type: object
    CommandAcceptedResponse:
      description: 'Generic shape for the typed OCPP command responses. Specific

        commands extend this; the generic form is what FastAPI advertises

        for routes whose typed shape is a follow-up task.'
      example:
        request_id: 9b3c5d18-1f7c-4b6a-8e0e-5b9a3c4f2e10
        status: Accepted
      properties:
        request_id:
          title: Request Id
          type: string
        status:
          description: OCPP-side response (`Accepted` / `Rejected` / `Unknown` for
            most commands; `Scheduled` for some). The exact enum is per OCPP 1.6.
          title: Status
          type: string
      required:
      - status
      - request_id
      title: CommandAcceptedResponse
      type: object
    ConnectorStatus:
      description: 'One row from the `cp_status` ClickHouse table — the most-recent

        StatusNotification per connector.'
      properties:
        connector_id:
          description: 0 is the charger itself; 1+ are physical connectors.
          minimum: 0.0
          title: Connector Id
          type: integer
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
        info:
          anyOf:
          - type: string
          - type: 'null'
          title: Info
        status:
          description: 'OCPP 1.6 §3.1.1 enum: Available, Preparing, Charging, …'
          title: Status
          type: string
        timestamp:
          anyOf:
          - type: string
          - type: 'null'
          description: ISO 8601 of the StatusNotification.
          title: Timestamp
        vendor_error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Vendor Error Code
        vendor_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Vendor Id
      required:
      - connector_id
      - status
      title: ConnectorStatus
      type: object
    ErrorEnvelope:
      description: 'Stable error shape per `docs/integration/02-gateway-rest-api.md`.


        All non-2xx responses from `/api/v1/*` carry this body. The 11

        `error_code` values are the closed enum from

        `src/eveys_ocpp/api/_errors.py` (BAD_REQUEST, UNAUTHORIZED,

        FORBIDDEN, UNKNOWN_CP_ID, UNKNOWN_TRANSACTION_ID,

        UNKNOWN_RESERVATION_ID, CHARGER_OFFLINE, CHARGER_TIMEOUT,

        WINDOW_TOO_LARGE, RATE_LIMITED, INTERNAL_ERROR).'
      example:
        error: 'unknown cp_id: CP_DOES_NOT_EXIST'
        error_code: UNKNOWN_CP_ID
        request_id: 9b3c5d18-1f7c-4b6a-8e0e-5b9a3c4f2e10
      properties:
        error:
          description: Human-readable description for logs.
          title: Error
          type: string
        error_code:
          description: Stable machine code; one of the 11 closed-enum values.
          title: Error Code
          type: string
        request_id:
          description: Correlation id mirroring the X-Request-ID header.
          title: Request Id
          type: string
      required:
      - error
      - error_code
      - request_id
      title: ErrorEnvelope
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    HealthComponents:
      properties:
        postgres:
          description: '`ok` or `unavailable`.'
          title: Postgres
          type: string
        redis:
          description: '`ok` or `unavailable`.'
          title: Redis
          type: string
      required:
      - postgres
      - redis
      title: HealthComponents
      type: object
    HealthResponse:
      description: '`GET /api/v1/health`. Liveness + per-component probe.'
      example:
        components:
          postgres: ok
          redis: ok
        request_id: 9b3c5d18-1f7c-4b6a-8e0e-5b9a3c4f2e10
        status: ok
        version: 0.0.0
      properties:
        components:
          $ref: '#/components/schemas/HealthComponents'
        request_id:
          title: Request Id
          type: string
        status:
          description: '`ok` when every component is `ok`; `degraded` otherwise.'
          title: Status
          type: string
        version:
          description: Gateway package version string.
          title: Version
          type: string
      required:
      - status
      - version
      - components
      - request_id
      title: HealthResponse
      type: object
    MeterValueSample:
      properties:
        connector_id:
          title: Connector Id
          type: integer
        context:
          anyOf:
          - type: string
          - type: 'null'
          title: Context
        location:
          anyOf:
          - type: string
          - type: 'null'
          title: Location
        measurand:
          description: 'OCPP 1.6 measurand: Energy.Active.Import.Register, …'
          title: Measurand
          type: string
        phase:
          anyOf:
          - type: string
          - type: 'null'
          title: Phase
        timestamp:
          title: Timestamp
          type: string
        transaction_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Transaction Id
        unit:
          description: Wh, W, A, V, °C, …
          title: Unit
          type: string
        value:
          title: Value
          type: number
      required:
      - timestamp
      - connector_id
      - measurand
      - value
      - unit
      title: MeterValueSample
      type: object
    MeterValuesResponse:
      description: '`GET /api/v1/charge-points/{cp_id}/meter-values?from=…&to=…`.'
      properties:
        cp_id:
          title: Cp Id
          type: string
        request_id:
          title: Request Id
          type: string
        samples:
          items:
            $ref: '#/components/schemas/MeterValueSample'
          title: Samples
          type: array
      required:
      - cp_id
      - samples
      - request_id
      title: MeterValuesResponse
      type: object
    RemoteStartRequest:
      example:
        connector_id: 1
        id_tag: RFID_VALID_001
      properties:
        charging_profile:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          title: Charging Profile
        connector_id:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          description: Optional. Charger picks one if omitted.
          title: Connector Id
        id_tag:
          description: The RFID / token the charger should associate with the session.
          title: Id Tag
          type: string
      required:
      - id_tag
      title: RemoteStartRequest
      type: object
    RemoteStopRequest:
      example:
        transaction_id: 12345
      properties:
        transaction_id:
          title: Transaction Id
          type: integer
      required:
      - transaction_id
      title: RemoteStopRequest
      type: object
    Reservation:
      properties:
        connector_id:
          title: Connector Id
          type: integer
        expiry_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Expiry Date
        id_tag:
          title: Id Tag
          type: string
        reservation_id:
          title: Reservation Id
          type: integer
        status:
          description: '`active` or `cancelled`.'
          title: Status
          type: string
      required:
      - reservation_id
      - connector_id
      - id_tag
      - status
      title: Reservation
      type: object
    ReservationListResponse:
      properties:
        request_id:
          title: Request Id
          type: string
        reservations:
          items:
            $ref: '#/components/schemas/Reservation'
          title: Reservations
          type: array
      required:
      - reservations
      - request_id
      title: ReservationListResponse
      type: object
    ResetRequest:
      example:
        type: Soft
      properties:
        type:
          description: Soft = restart software; Hard = full power cycle.
          pattern: ^(Soft|Hard)$
          title: Type
          type: string
      required:
      - type
      title: ResetRequest
      type: object
    StatusEvent:
      properties:
        connector_id:
          title: Connector Id
          type: integer
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
        info:
          anyOf:
          - type: string
          - type: 'null'
          title: Info
        status:
          title: Status
          type: string
        timestamp:
          title: Timestamp
          type: string
        vendor_error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Vendor Error Code
        vendor_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Vendor Id
      required:
      - timestamp
      - connector_id
      - status
      title: StatusEvent
      type: object
    StatusHistoryResponse:
      description: '`GET /api/v1/charge-points/{cp_id}/status-history?from=…&to=…`.'
      properties:
        cp_id:
          title: Cp Id
          type: string
        events:
          items:
            $ref: '#/components/schemas/StatusEvent'
          title: Events
          type: array
        request_id:
          title: Request Id
          type: string
      required:
      - cp_id
      - events
      - request_id
      title: StatusHistoryResponse
      type: object
    Transaction:
      properties:
        connector_id:
          title: Connector Id
          type: integer
        cp_id:
          title: Cp Id
          type: string
        id_tag:
          description: RFID / token used to authorize the session.
          title: Id Tag
          type: string
        meter_start_wh:
          title: Meter Start Wh
          type: integer
        meter_stop_wh:
          anyOf:
          - type: integer
          - type: 'null'
          title: Meter Stop Wh
        open:
          description: True until StopTransaction lands.
          title: Open
          type: boolean
        started_at:
          description: ISO 8601 timestamp of the StartTransaction.
          title: Started At
          type: string
        stop_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Stop Reason
        stopped_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Stopped At
        transaction_id:
          description: OCPP 1.6 transaction id assigned by the gateway.
          title: Transaction Id
          type: integer
      required:
      - transaction_id
      - cp_id
      - connector_id
      - id_tag
      - meter_start_wh
      - started_at
      - open
      title: Transaction
      type: object
    TransactionDetail:
      example:
        connector_id: 1
        cp_id: CP_BERLIN_001
        id_tag: RFID_VALID_001
        meter_start_wh: 1000000
        meter_stop_wh: 1012345
        open: false
        request_id: 9b3c5d18-1f7c-4b6a-8e0e-5b9a3c4f2e10
        started_at: '2026-05-07T12:00:00+00:00'
        stop_reason: Local
        stopped_at: '2026-05-07T12:30:00+00:00'
        transaction_id: 12345
      properties:
        connector_id:
          title: Connector Id
          type: integer
        cp_id:
          title: Cp Id
          type: string
        id_tag:
          description: RFID / token used to authorize the session.
          title: Id Tag
          type: string
        meter_start_wh:
          title: Meter Start Wh
          type: integer
        meter_stop_wh:
          anyOf:
          - type: integer
          - type: 'null'
          title: Meter Stop Wh
        open:
          description: True until StopTransaction lands.
          title: Open
          type: boolean
        request_id:
          title: Request Id
          type: string
        started_at:
          description: ISO 8601 timestamp of the StartTransaction.
          title: Started At
          type: string
        stop_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Stop Reason
        stopped_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Stopped At
        transaction_id:
          description: OCPP 1.6 transaction id assigned by the gateway.
          title: Transaction Id
          type: integer
      required:
      - transaction_id
      - cp_id
      - connector_id
      - id_tag
      - meter_start_wh
      - started_at
      - open
      - request_id
      title: TransactionDetail
      type: object
    TransactionListResponse:
      description: '`GET /api/v1/charge-points/{cp_id}/transactions`.'
      example:
        request_id: 9b3c5d18-1f7c-4b6a-8e0e-5b9a3c4f2e10
        transactions:
        - connector_id: 1
          cp_id: CP_BERLIN_001
          id_tag: RFID_VALID_001
          meter_start_wh: 1000000
          meter_stop_wh: 1012345
          open: false
          started_at: '2026-05-07T12:00:00+00:00'
          stop_reason: Local
          stopped_at: '2026-05-07T12:30:00+00:00'
          transaction_id: 12345
      properties:
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
        request_id:
          title: Request Id
          type: string
        transactions:
          items:
            $ref: '#/components/schemas/Transaction'
          title: Transactions
          type: array
      required:
      - transactions
      - next_cursor
      - request_id
      title: TransactionListResponse
      type: object
    UpdateBody:
      description: 'PATCH body. The keys in `updates` must be allowlisted; the

        values are coerced per the allowlist''s `coerce` callable.'
      properties:
        updates:
          additionalProperties: true
          description: Map of `field_name → new_value` for allowlisted fields.
          title: Updates
          type: object
      title: UpdateBody
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
info:
  description: Inbound REST surface (E3-7 / E3-8). Backend services read charger and
    transaction state under `/api/v1/charge-points`, `/api/v1/transactions`, etc.,
    and dispatch OCPP commands via `/api/v1/charge-points/{cp_id}/commands/*`. All
    endpoints require a bearer token (`EVEYS_OCPP_REST_INBOUND_TOKENS`); `/api/v1/health`
    is exempt. Errors carry the closed-enum envelope `{error, error_code, request_id}`
    documented in [`docs/integration/02-gateway-rest-api.md`](https://github.com/eveys-mobility/OCPP/blob/main/docs/integration/02-gateway-rest-api.md).
  title: eveys/ocpp gateway
  version: 0.0.0
openapi: 3.1.0
paths:
  /api/v1/admin/config:
    get:
      operationId: get_config_api_v1_admin_config_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Get Config Api V1 Admin Config Get
                type: object
          description: Successful Response
      summary: GET effective runtime configuration
      tags:
      - admin
    patch:
      operationId: patch_config_api_v1_admin_config_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Patch Config Api V1 Admin Config Patch
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: PATCH allowlisted runtime overrides
      tags:
      - admin
  /api/v1/admin/config/overrides/{key}:
    delete:
      operationId: delete_override_api_v1_admin_config_overrides__key__delete
      parameters:
      - in: path
        name: key
        required: true
        schema:
          title: Key
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Delete Override Api V1 Admin Config Overrides  Key  Delete
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: DELETE a single runtime override (revert to env-driven default)
      tags:
      - admin
  /api/v1/charge-points:
    get:
      operationId: list_charge_points_route_api_v1_charge_points_get
      parameters:
      - in: query
        name: cursor
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - in: query
        name: limit
        required: false
        schema:
          anyOf:
          - maximum: 10000
            minimum: 1
            type: integer
          - type: 'null'
          title: Limit
      - in: query
        name: online
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Online
      - in: query
        name: vendor
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Vendor
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargePointListResponse'
                additionalProperties: true
                title: Response List Charge Points Route Api V1 Charge Points Get
                type: object
          description: Successful Response
        '422':
