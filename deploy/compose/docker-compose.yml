# Local development stack for eveys/ocpp.
#
# Per docs/07-local-dev-setup.md — brings up the data plane (Postgres, Redis,
# Kafka, ClickHouse). The eveys/ocpp service container itself is commented out
# below; it is enabled when the Dockerfile (task E0-5) and the runnable service
# (E1-1..E1-9) land. Until then, run the service against this compose stack
# directly from the host: `python -m eveys_ocpp` after `make install`.
#
# CREDENTIALS BELOW ARE FOR LOCAL DEV ONLY. They must NEVER be used in
# staging or production. Real secrets are managed by the secrets manager
# (decision pending; ADR-TBD).

name: eveys-ocpp

services:
  postgres:
    image: postgres:16-alpine
    container_name: eveys-ocpp-postgres
    environment:
      POSTGRES_USER: eveys
      POSTGRES_PASSWORD: eveys           # local-dev only
      POSTGRES_DB: eveys_ocpp
    ports:
      # Host 55432 (well clear of the canonical 5432 + the 5433 fallback
      # that local Postgres clusters / pgbouncer / Supabase CLI tend to
      # squat on). Same shape as ClickHouse (8124→8123) and the gateway
      # WS (19000→9000). In-network containers still reach Postgres on
      # `postgres:5432` via the service hostname, unchanged.
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eveys -d eveys_ocpp"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: eveys-ocpp-redis
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    # Apache's first-party image (Bitnami's public images moved to bitnamilegacy/
    # after a 2025 licensing change; we use Apache's directly for longevity).
    image: apache/kafka:3.7.0
    container_name: eveys-ocpp-kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft mode — no ZooKeeper.
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      # Two PLAINTEXT listeners on different ports so a single broker can
      # serve both host-side clients (laptop running pytest, an IDE, the
      # `python -m eveys_ocpp` dev loop) AND in-compose-network clients
      # (the `ocpp` and `clickhouse-ingestor` containers).
      #
      # An advertised listener is what the broker tells the client to
      # reconnect to AFTER bootstrap. With a single `localhost:9092`
      # advertisement, in-container clients bootstrap fine but every
      # follow-up metadata response sends them to `localhost`, which
      # inside their own container is themselves — connection refused.
      # Hence the dual layout: HOST://*:9092 advertised as `localhost:9092`
      # for `host.docker.internal`-style host access, INTERNAL://*:29092
      # advertised as `kafka:29092` for the docker network.
      KAFKA_LISTENERS: "HOST://:9092,INTERNAL://:29092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "HOST://localhost:9092,INTERNAL://kafka:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,INTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      # Auto-create topics for dev convenience. Disabled in prod.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    # No persistent volume in dev: Kafka logs in /tmp survive container
    # restarts but are wiped by `make compose-down-volumes`. Restoring them
    # from a fresh start is fine for local development.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  clickhouse:
    # Use the Ubuntu-based image, not :24-alpine — the alpine variant hits
    # a `get_mempolicy: Operation not permitted` startup loop on Apple Silicon
    # (M1/M2/M3) under Docker Desktop.
    image: clickhouse/clickhouse-server:24
    container_name: eveys-ocpp-clickhouse
    ports:
      # HTTP remapped to 8124: the canonical 8123 is squatted by any
      # Homebrew `clickhouse server` already running on the laptop
      # (loopback bind wins over docker's `*:8123`). When the
      # collision happened our `make ch-migrate` silently targeted
      # the wrong server and the stack went into a confusing split-
      # brain state. See issue #24. `make ch-migrate` now passes
      # `--port 8124` to match this; ad-hoc curl probes also need
      # 8124 (e.g. `curl http://localhost:8124/?query=...`).
      - "8124:8123"   # HTTP   (host 8124 → container 8123)
      - "9001:9000"   # native (remapped: host 9001 → container 9000 to free
                      # host port 9000 for the eveys/ocpp WebSocket server)
    environment:
      CLICKHOUSE_DB: eveys_ocpp
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""           # local-dev only
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    deploy:
      resources:
        limits:
          memory: 4G
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      # BusyBox wget in the alpine image doesn't accept GNU-style flags;
      # use the bare `-q -O -` form which works in both BusyBox and GNU wget.
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8123/ping | grep -q Ok"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  # ---- migration init-containers (eveys-mobility/OCPP#234) ------------------
  #
  # Each is a one-shot service that applies pending schema migrations
  # then exits 0. The `ocpp` and `clickhouse-ingestor` services
  # `depends_on: { condition: service_completed_successfully }` so a
  # fresh stack — or a stack pulling an image with a new migration —
  # is guaranteed to be at-HEAD before any consumer starts.
  #
  # `restart: "no"` is intentional. If a migration fails the stack
  # halts loudly with a non-zero exit; the alternative (silent
  # crashloop) is the failure mode #234 was filed to prevent. Inspect
  # `docker compose logs migrate-postgres migrate-clickhouse` to
  # diagnose.
  #
  # The Helm chart equivalent (pre-install/pre-upgrade hook or init
  # container on the gateway Deployment) is separate work — see
  # #234's "Helm chart equivalent" decision point.
  migrate-postgres:
    image: eveys-ocpp:dev
    container_name: eveys-ocpp-migrate-postgres
    # Alembic is async-friendly (see alembic/env.py); run via
    # `python -m alembic` against the image's bundled WORKDIR /build,
    # which now ships alembic.ini + alembic/ alongside the venv.
    command: ["-m", "alembic", "upgrade", "head"]
    environment:
      # Same DSN the runtime uses; alembic reads it via
      # eveys_ocpp.settings.get_settings().db_url.
      EVEYS_OCPP_DB_URL: postgresql+asyncpg://eveys:eveys@postgres:5432/eveys_ocpp
      EVEYS_OCPP_LOG_JSON: "true"
      EVEYS_OCPP_LOG_LEVEL: "INFO"
    # `on-failure:5` covers the race between Postgres's healthcheck
    # flipping healthy and asyncpg's first connect actually succeeding
    # — Postgres can claim healthy a moment before it accepts new
    # connections under load. A real migration failure still exits
    # cleanly after 5 attempts and blocks `ocpp` from starting (since
    # consumers wait on `service_completed_successfully`, not just
    # `started`); 5 × ~10s is enough headroom on a laptop without
    # masking a genuinely-broken migration for too long.
    restart: on-failure:5
    depends_on:
      postgres: { condition: service_healthy }

  migrate-clickhouse:
    image: eveys-ocpp:dev
    container_name: eveys-ocpp-migrate-clickhouse
    # The ClickHouse migrator is HTTP/8123 (not the 9000 native
    # protocol) — kept stdlib-urllib on purpose, see migrate.py
    # header. Forward host/port/db verbatim from env so the same
    # image works under Helm with different addresses.
    command:
      - "-m"
      - "eveys_ocpp.clickhouse.migrate"
      - "--host=clickhouse"
      - "--port=8123"
      - "--db=eveys_ocpp"
    environment:
      EVEYS_OCPP_LOG_JSON: "true"
      EVEYS_OCPP_LOG_LEVEL: "INFO"
    # `on-failure:3` as a belt-and-braces complement to the script's
    # own connection-refused retry loop (`--wait-attempts=12` covers
    # ~30s of HTTP-listener warmup). Three compose-level retries give
    # us a second escape hatch if some failure mode slips past the
    # in-script loop without masking a real migration error.
    restart: on-failure:3
    depends_on:
      clickhouse: { condition: service_healthy }

  ocpp:
    # Built locally from deploy/Dockerfile (distroless multi-stage; ~168 MB).
    # Use `make build-image` (or `docker compose build ocpp`) before
    # `make compose-up` to refresh the image.
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    image: eveys-ocpp:dev
    container_name: eveys-ocpp
    # Host port 19000 instead of 9000: standalone ClickHouse client and many
    # IDEs (PhpStorm, JetBrains TBE) squat on 9000. Inside the compose
    # network the service still listens on 9000.
    ports:
      - "19000:9000"     # WebSocket (host 19000 → container 9000)
      - "50051:50051"    # gRPC (lands with E2-4)
      - "9100:9100"      # Prometheus metrics (lands with E4-1)
      - "8080:8080"      # Backend-facing REST surface (ADR-0026)
    # Make the developer's host backend (e.g. https://toger.test or
    # http://localhost) reachable from inside the container. On Docker
    # Desktop macOS / Windows, host-gateway resolves to the host's NIC.
    extra_hosts:
      - "toger.test:host-gateway"
      - "host.docker.internal:host-gateway"
    environment:
      EVEYS_OCPP_DB_URL: postgresql+asyncpg://eveys:eveys@postgres:5432/eveys_ocpp
      EVEYS_OCPP_REDIS_URL: redis://redis:6379/0
      # Use the INTERNAL listener — see the `kafka` service for why both
      # exist. `localhost:9092` (the default in `Settings`) only works
      # for processes running on the laptop, not for sibling containers.
      EVEYS_OCPP_KAFKA_BROKERS: kafka:29092
      EVEYS_OCPP_CLICKHOUSE_HOST: clickhouse
      EVEYS_OCPP_CLICKHOUSE_PORT: "9000"
      EVEYS_OCPP_CLICKHOUSE_DB: eveys_ocpp
      EVEYS_OCPP_LOG_JSON: "true"
      EVEYS_OCPP_LOG_LEVEL: "INFO"
      # Backend integration: each variable is read from the developer's
      # shell or .env at compose-up time. Empty values disable cleanly
      # (the gateway falls back to its offline policies).
      EVEYS_OCPP_REST_INBOUND_TOKENS: ${EVEYS_OCPP_REST_INBOUND_TOKENS:-}
      # Dev-only shortcuts for the REST surface. ADR-0026 keeps both
      # OFF in production: OPENAPI_ENABLED publishes the schema
      # discovery surface; AUTH_DISABLED removes bearer-token
      # enforcement. The COMPOSE default for OPENAPI_ENABLED is `true`
      # so a fresh `make compose-up` already serves Swagger UI at
      # `/api/v1/docs` — the production posture is governed by Helm /
      # k8s, not this file. AUTH_DISABLED stays `false`: keep the
      # bearer-token path exercised in dev (Swagger UI's "Authorize"
      # button is the documented dev-laptop UX; see `make get-token`).
      EVEYS_OCPP_REST_OPENAPI_ENABLED: ${EVEYS_OCPP_REST_OPENAPI_ENABLED:-true}
      EVEYS_OCPP_REST_AUTH_DISABLED: ${EVEYS_OCPP_REST_AUTH_DISABLED:-false}
      EVEYS_OCPP_BACKEND_BASE_URL: ${EVEYS_OCPP_BACKEND_BASE_URL:-}
      EVEYS_OCPP_BACKEND_TOKEN: ${EVEYS_OCPP_BACKEND_TOKEN:-}
      EVEYS_OCPP_BACKEND_AUTHORIZE_FALLBACK: ${EVEYS_OCPP_BACKEND_AUTHORIZE_FALLBACK:-reject}
      # TLS verify defaults to True (production-safe). Local dev with
      # a self-signed backend (e.g. https://toger.test) sets this to
      # False in repo-root .env. Applies to BOTH the backend HTTP
      # client and the webhook dispatcher; the gateway logs a loud
      # warning at each site when the value is False so it can't ship
      # to production by accident.
      EVEYS_OCPP_OUTBOUND_TLS_VERIFY: ${EVEYS_OCPP_OUTBOUND_TLS_VERIFY:-true}
      EVEYS_OCPP_WEBHOOK_BASE_URL: ${EVEYS_OCPP_WEBHOOK_BASE_URL:-}
      EVEYS_OCPP_WEBHOOK_SECRET: ${EVEYS_OCPP_WEBHOOK_SECRET:-}
      EVEYS_OCPP_WEBHOOK_URL_CP_BOOT: ${EVEYS_OCPP_WEBHOOK_URL_CP_BOOT:-}
      EVEYS_OCPP_WEBHOOK_URL_CP_ONLINE: ${EVEYS_OCPP_WEBHOOK_URL_CP_ONLINE:-}
      EVEYS_OCPP_WEBHOOK_URL_CP_STATUS: ${EVEYS_OCPP_WEBHOOK_URL_CP_STATUS:-}
      EVEYS_OCPP_WEBHOOK_URL_TX_STARTED: ${EVEYS_OCPP_WEBHOOK_URL_TX_STARTED:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      # Block boot until both migrators report exit 0. Prevents the
      # "code ships but schema lags" failure mode that bit the
      # ingestor in #234 — see the comment on the migrate-* services.
      migrate-postgres: { condition: service_completed_successfully }
      migrate-clickhouse: { condition: service_completed_successfully }
    # Envoy's first health-check fires the moment it starts and a
    # network-level failure on attempt #1 puts the upstream in a
    # state Envoy doesn't always reschedule from. Adding a
    # healthcheck here lets Envoy's `depends_on: condition:
    # service_healthy` wait until /api/v1/ready answers 200 before
    # Envoy boots — first health-check is then guaranteed to land
    # on a ready REST listener.
    healthcheck:
      test:
        - CMD
        - python3.13
        - -c
        - |
          import urllib.request, sys
          try:
              with urllib.request.urlopen("http://127.0.0.1:8080/api/v1/ready", timeout=2) as r:
                  sys.exit(0 if r.status == 200 else 1)
          except Exception:
              sys.exit(1)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # Sidecar consumer for the Kafka → ClickHouse pipeline (E2-14, ADR-0020).
  # Reuses the same image as the gateway — entry point is overridden to run
  # the ingestor module instead of the WS+gRPC server.
  clickhouse-ingestor:
    image: eveys-ocpp:dev
    container_name: eveys-ocpp-clickhouse-ingestor
    # The ENTRYPOINT in `deploy/Dockerfile` is the interpreter
    # (`python3.13`); compose's `command:` is its argv. So just `-m
    # ...` here, NOT `python -m ...` — passing `python` as argv[0]
    # would make the interpreter try to run a file called `python`.
    command: ["-m", "eveys_ocpp.clickhouse.ingestor"]
    environment:
      # `kafka:29092` is the INTERNAL listener — the only one that
      # advertises a hostname reachable from inside the compose network.
      # The `:9092` advertisement is for laptop-side clients only.
      EVEYS_OCPP_KAFKA_BROKERS: "kafka:29092"
      EVEYS_OCPP_CLICKHOUSE_HOST: "clickhouse"
      EVEYS_OCPP_CLICKHOUSE_PORT: "9000"
      EVEYS_OCPP_CLICKHOUSE_DB: "eveys_ocpp"
      EVEYS_OCPP_LOG_JSON: "true"
      EVEYS_OCPP_LOG_LEVEL: "INFO"
    depends_on:
      kafka: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      # Same migration gate as `ocpp`: don't start the ingestor until
      # the CH schema is at HEAD. The dead-ingestor case in #234 was
      # exactly "tables don't exist yet, 10 flush failures, exit 1."
      migrate-clickhouse: { condition: service_completed_successfully }

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
